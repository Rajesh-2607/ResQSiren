# resQ Siren — API, Postgres and Redis on Render's free tier.
# The frontend (apps/web-dashboard) deploys separately to Vercel; set its
# VITE_API_BASE_URL to this service's URL, and set CORS_ORIGINS here to the
# Vercel URL.

databases:
  - name: resq-postgres
    databaseName: resq_siren
    plan: free

services:
  # Per-junction pre-emption claims and live ambulance GPS pings (30s TTL).
  - type: redis
    name: resq-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: resq-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render hands out a postgresql:// URL; config.py rewrites it to
      # postgresql+asyncpg:// and strips sslmode, which asyncpg rejects.
      - key: DATABASE_URL
        fromDatabase:
          name: resq-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: resq-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: HMAC_SECRET
        generateValue: true
      # Set to the deployed frontend origin, e.g. https://resq-siren.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Optional. Without it the patient summary uses a deterministic template.
      - key: GEMINI_API_KEY
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
