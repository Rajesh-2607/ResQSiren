services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resq_siren
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    ports:
      - "4000:4000"
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      # These two must point at the docker-internal hostnames regardless of
      # what apps/api/.env has (it's set up for running the API on the host).
      # `environment:` overrides `env_file:` for the same key in Compose, so
      # this always wins over whatever DATABASE_URL/REDIS_URL is in .env.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/resq_siren
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
